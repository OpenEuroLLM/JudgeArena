schema_version: 1
task_version: 1
tags: [single-answer, safety, multilingual]
variants:
  selector: lang
  values: [en, de, zh, pl, it]
dataset:
  adapter: eu_guard
  sources:
    benchmark:
      type: huggingface_dataset
      repo_id: EU-Guard/EU-Guard
      revision: efdc4e6737a9ff2e1b734d9bca56fd31ea97bfdf
      config: human_reviewed
  options:
    split: test
protocol:
  runner: single_answer
  generation:
    mode: single_turn_chat
    default_temperature: 0.0
    default_max_out_tokens: 4096
    default_truncate_input: false
  judge:
    default_prompt_preset: decision
    use_default_engine_kwargs: false
    default_temperature: 0.0
    default_max_out_tokens: 256
  scoring:
    metrics:
      - metric: eu_guard
        parameters: {threshold: 0.5}
        breakdown_by: [lang, category, legal_provision_id]
metadata:
  reference_implementation: https://huggingface.co/datasets/EU-Guard/EU-Guard
