extends: _base.yaml
task: elo-comparia
description: Arena-anchored ELO evaluation using ComparIA human preference battles.

variants:
  selector: language
  # Detected-language census of the pinned snapshot: 94% fr, 4% en; every
  # other language has <500 battles.
  values: [fr, en]

dataset:
  sources:
    comparia:
      type: huggingface_dataset
      repo_id: ministere-culture/comparia-votes
      revision: "7a40bce496c1f2aa3be4001da85a49cb4743042b"
      allow_patterns: [votes.parquet]

protocol:
  arena: ComparIA

metadata:
  reference_implementation: https://huggingface.co/datasets/ministere-culture/comparia-votes
