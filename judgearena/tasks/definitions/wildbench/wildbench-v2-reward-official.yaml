extends: _base.yaml
task: wildbench-v2-reward-official
description: Official WildBench V2 pairwise reward mix over three references.

dataset:
  sources:
    official_outputs:
      type: huggingface_dataset
      repo_id: allenai/WildBench-V2-Model-Outputs
      revision: "d6755bc68220df853c0825a733430f73f5af2501"
      allow_patterns:
        - gpt-4-turbo-2024-04-09/*.parquet
        - claude-3-haiku-20240307/*.parquet
        - Llama-2-70b-chat-hf/*.parquet

protocol:
  mode: reward
  baseline:
    strategy: official_outputs
    source: official_outputs
    references:
      - gpt-4-turbo-2024-04-09
      - claude-3-haiku-20240307
      - Llama-2-70b-chat-hf
    allow_runtime_override: true
  judge:
    prompt_file: reward-prompt.txt
    parser: wildbench-choice
    reference_judge: gpt-4-turbo-2024-04-09
    max_words_to_eval: 1000
    assignment_seed: 42
    default_swap_mode: fixed
    allowed_swap_modes: [fixed]
    default_temperature: 0.0
    default_max_out_tokens: 1024
  scoring:
    adapter: wildbench-reward-v2
    default_length_penalty_chars: null
