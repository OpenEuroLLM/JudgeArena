extends: _base.yaml
task: wildbench-reward-mix
description: WildBench v2 mean WB-Reward against three reference models.
tags: [pairwise, instruction-following, multi-turn, wildbench]

protocol:
  runner: pairwise
  judge:
    default_prompt_preset: wildbench-reward
    default_swap_mode: random
    default_temperature: 0.0
    default_max_out_tokens: 4096
  baseline:
    strategy: all_references
    references:
      - gpt-4-turbo-2024-04-09
      - claude-3-haiku-20240307
      - Llama-2-70b-chat-hf
  scoring:
    metrics:
      - metric: wildbench_reward_mix
        breakdown_by: [category]
        parameters:
          length_penalty_threshold: -1
