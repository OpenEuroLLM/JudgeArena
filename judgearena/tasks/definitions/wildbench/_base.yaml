schema_version: 1
task_version: 1
tags: [wildbench, instruction-following, multi-turn]

dataset:
  adapter: wildbench
  sources:
    examples:
      type: huggingface_dataset
      repo_id: allenai/WildBench
      revision: "26c49eb39d7d5ce2099b0bbafed5a88dcce954ec"
      allow_patterns: [v2/*.parquet]
  fields:
    id: session_id
    instruction: conversation_input
    category: primary_tag

protocol:
  runner: wildbench
  generation:
    mode: conversation_chat
  judge:
    default_temperature: 0.0
    max_words_to_eval: 1000

metadata:
  reference_implementation: https://github.com/allenai/WildBench
  paper: https://arxiv.org/abs/2406.04770
