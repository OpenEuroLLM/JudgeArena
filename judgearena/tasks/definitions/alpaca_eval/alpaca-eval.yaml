extends: _base.yaml
task: alpaca-eval
task_version: 2
description: >-
  AlpacaEval 2.0 with the official annotator, randomized pair order,
  logprob-weighted preferences, and length-controlled scoring.

protocol:
  judge:
    default_prompt_preset: alpaca-eval
    default_swap_mode: random
    default_temperature: 1
    # The official annotator asks for exactly one token ("m" or "M") and
    # weights the verdict by its top-5 logprobs.
    default_max_out_tokens: 1
    default_top_logprobs: 5
  scoring:
    metrics:
      - metric: alpaca_eval_length_controlled
        parameters:
          calibration_repo_id: tatsu-lab/alpaca_eval
          calibration_filename: df_gamed.csv
          calibration_revision: "2edc6fad8be6b14ea7230aabfd08188da6b8b814"
          # Upstream uses lambda=0.2 split over two gamed baselines.
          gamed_weight: 0.1
