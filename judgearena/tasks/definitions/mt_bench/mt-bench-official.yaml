extends: _base.yaml
task: mt-bench-official
description: >-
  MT-Bench with the pinned FastChat defaults: 1024-token evaluated answers
  with seed 0, gpt-3.5-turbo baseline answers, both answer orders, and the
  2048-token budget used by FastChat's default gpt-4 judge.

dataset:
  sources:
    benchmark:
      allow_patterns:
        - data/mt_bench/question.jsonl
        - data/mt_bench/model_answer/gpt-3.5-turbo.jsonl

protocol:
  generation:
    default_max_out_tokens: 1024
    default_seed: 0
  baseline:
    reference_id: gpt-3.5-turbo
    allow_runtime_override: false
  judge:
    default_swap_mode: both
    allowed_swap_modes: [both]
    # Pinned FastChat defaults to gpt-4 as judge, whose OpenAI path uses 2048.
    # Its Anthropic path uses 1024, but JudgeArena has no Anthropic backend.
    default_max_out_tokens: 2048
