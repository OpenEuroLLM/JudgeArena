# Install judgearena[tune], then run: judgearena --config_path configs/tune_judge.yaml
task: tune-judge
judge:
  model: VLLM/Qwen/Qwen2.5-7B-Instruct
  prompt_preset: meta-eval-pair-score
  temperature: 0.0
  max_out_tokens: 8192
  max_model_len: null
generation:
  truncate_judge_input_chars: 8192
tune_judge:
  search_space:
    judge:
      model: [VLLM/Qwen/Qwen2.5-7B-Instruct, VLLM/google/gemma-2-9b-it]
      prompt_preset: [meta-eval-pair-score, arena-hard, default_with_explanation]
      swap_mode: [fixed, both]
      temperature: {lower: 0.0, upper: 1.0, prior_confidence: low}
      max_out_tokens: {lower: 1024, upper: 8192, log: true}
  # User-provided estimates in USD per 1M tokens (input and output); these
  # are explicit overrides, not live OpenRouter catalog prices.
  price_per_million_tokens:
    VLLM/Qwen/Qwen2.5-7B-Instruct: {input: 0.12, output: 0.12}
    VLLM/google/gemma-2-9b-it: {input: 0.14, output: 0.14}
  neps:
    total_evaluations_to_spend: 40
# Task defaults select meta-eval-lmarena-140k-en, agreement/cost objectives,
# mo_hyperband, and 10-90 battles per model. Each can be overridden here.
