# Example JudgeArena ELO-rating run config.
# Run with:  judgearena --config_path configs/elo_comparia.yaml
# ELO tasks rate a single model (model.name) against arena opponents; the
# arena and pinned battle sources come from the packaged task definition.
task: elo-comparia
model:
  name: Together/meta-llama/Llama-3.3-70B-Instruct-Turbo
judge:
  model: OpenRouter/google/gemma-4-31b-it
generation:
  n_instructions: 200
run:
  filters: {lang: [en]}
protocol:
  scoring:
    metrics:
      - metric: pairwise_win_rate
      - metric: bradley_terry
        parameters: {fit_mode: frozen, soft: true, n_bootstraps: 20}
