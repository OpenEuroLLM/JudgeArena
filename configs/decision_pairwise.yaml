# judgearena --config_path configs/decision_pairwise.yaml
task: alpaca-eval-ja
model:
  name: OpenRouter/google/gemma-4-31b-it
judge:
  model: Decisions/typesafe/jev-1.14
  engine_kwargs:
    endpoint: https://openrouter.ai/api/alpha/decisions
    api_key_env: OPENROUTER_API_KEY
  prompt:
    preset: decision
    options:
      judging_mode: pairwise
      questions:
        winner:
          type: choice
          instructions: Which answer better satisfies instruction?
          criteria:
            A: completion_a is better.
            B: completion_b is better.
            tie: Both answers are equally good or equally poor.
      result:
        preference:
          question: winner
          values: {A: 0.0, B: 1.0, tie: 0.5}
          aggregation: expected
protocol:
  runner: pairwise
  generation:
    mode: single_turn_chat
  baseline:
    strategy: task_default
    reference_id: gpt4_1106_preview
  judge:
    default_prompt_preset: decision
    default_swap_mode: fixed
  scoring:
    metrics:
      - metric: pairwise_win_rate
generation:
  n_instructions: 4
run:
  store_root: ./cache/decisions
