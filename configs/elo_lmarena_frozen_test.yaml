# Local multilingual frozen-leaderboard smoke test.
# It uses a deterministic dummy judge, so it needs no model credentials.
# Replace the judge before freezing a real leaderboard.
#
# uv run python scripts/freeze_leaderboard.py \
#   --config configs/elo_lmarena_frozen_test.yaml \
#   --output leaderboards/lmarena-test-v1 \
#   --name lmarena-test-v1 \
#   --languages en fr de es \
#   --battles-per-language 100 \
#   --anchor-model claude-opus-4-20250514 \
#   --anchor-model mistral-medium-2505 \
#   --anchor-model o3-2025-04-16 \
#   --anchor-model qwen3-235b-a22b-no-thinking
#
# Submit a dummy model after freezing:
# uv run judgearena \
#   --config_path leaderboards/lmarena-test-v1/config.yaml \
#   --elo.leaderboard_dir leaderboards/lmarena-test-v1 \
#   --model.name Dummy/test-candidate

task: elo-lmarena-140k

# The name is replaced when a model is submitted. The generation settings are
# part of the frozen protocol and cannot change between submissions.
model:
  name: Dummy/freeze-placeholder
  max_out_tokens: 2048
  temperature: 0.0
  top_p: 1.0
  seed: 0

judge:
  model: "Dummy/score A: 5 score B: 5"
  max_out_tokens: 64
  swap_mode: both
  temperature: 0.0

# The freeze command chooses the panel size. Do not truncate it here.
generation:
  n_instructions: null
  truncate_all_input_chars: 8192

elo:
  # This exact arena model is the fifth anchor and is fixed at 1000 Elo.
  baseline_model: gemini-2.5-flash
  languages: [en, fr, de, es]
  n_bootstraps: 20
  soft_elo: true
  # Fixed beta for this dummy smoke test. For a real judge, set
  # calibrate_temperature: true and use a total calibration_size such as 160.
  soft_elo_temperature: 0.3
  calibrate_temperature: false
  calibration_size: null

run:
  seed: 0
  result_folder: results
