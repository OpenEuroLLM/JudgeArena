# Evaluation settings for a local multilingual leaderboard smoke test.
# The deterministic dummy judge needs no model credentials.
# Use these settings under `evaluation` in a leaderboard setup file;
# see configs/leaderboards/multilingual-v0.01.yaml for the setup structure.
# Replace the dummy judge before creating a real leaderboard.
#
# uv run judgearena leaderboard create SETUP.yaml --output leaderboards/lmarena-test-v1
# uv run judgearena leaderboard evaluate leaderboards/lmarena-test-v1 --model Dummy/test-candidate

task: elo-lmarena-140k

# The name is replaced when a model is submitted. The generation settings are
# part of the frozen protocol and cannot change between submissions.
model:
  name: Dummy/freeze-placeholder
  max_out_tokens: 2048
  temperature: 0.0
  top_p: 1.0
  seed: 0

judge:
  model: "Dummy/score A: 5 score B: 5"
  max_out_tokens: 64
  swap_mode: both
  temperature: 0.0

# The freeze command chooses the panel size. Do not truncate it here.
generation:
  n_instructions: null
  truncate_all_input_chars: 8192

elo:
  # This arena model defines the reference point at 1000 Elo.
  baseline_model: gemini-2.5-flash
  languages: [en, fr, de, es]
  n_bootstraps: 20
  soft_elo: true
  # Fixed beta for this dummy smoke test. For a real judge, set
  # calibrate_temperature: true and use a total calibration_size such as 160.
  soft_elo_temperature: 0.3
  calibrate_temperature: false
  calibration_size: null

run:
  seed: 0
  result_folder: results
