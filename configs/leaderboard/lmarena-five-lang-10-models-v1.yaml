task: elo-lmarena-140k
judge:
  model: OpenRouter/google/gemma-4-31b-it
  prompt:
    preset: arena-hard
  swap_mode: both
  temperature: 0.0
  max_out_tokens: 2048
generation:
  truncate_judge_input_chars: null
run:
  seed: 42
  use_tqdm: true
  store_root: ./cache/leaderboard
  filters:
    lang:
    - en
    - pl
    - de
    - fr
    - es
leaderboard:
  version: lmarena-five-lang-10-models-v1
  labels: human
  sampling:
    validation_fraction: 0.1
    minimum_model_comparisons: 50
    comparisons_per_opponent: 20
    opponents:
      - gemini-2.5-pro
      - o3-2025-04-16
      - deepseek-r1-0528
      - qwen3-235b-a22b-no-thinking
      - mistral-medium-2505
      - gemma-3-27b-it
      - claude-opus-4-20250514
      - claude-sonnet-4-20250514
      - llama-3.3-70b-instruct
      - amazon.nova-pro-v1:0

protocol:
  scoring:
    metrics:
    - metric: bradley_terry
      name: elo
      parameters:
        soft: false
        baseline_model: gemma-3-27b-it
        n_bootstraps: 200
    - metric: bradley_terry
      name: soft_elo
      parameters:
        soft: true
        baseline_model: gemma-3-27b-it
        n_bootstraps: 200
