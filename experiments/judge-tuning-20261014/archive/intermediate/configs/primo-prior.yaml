task: tune-judge
judge:
  model: VLLM/google/gemma-4-31B-it
  prompt_preset: default
  swap_mode: fixed
  temperature: 0.0
  seed: 42
  max_out_tokens: 8192
  max_model_len: 65536
  engine_kwargs:
    tensor_parallel_size: 4
    kv_cache_dtype: auto
    gpu_memory_utilization: 0.9
    enforce_eager: true
    language_model_only: true
    disable_thinking: false
    thinking_token_budget: null
    skip_special_tokens: false
    chat_template_kwargs:
      enable_thinking: true
generation:
  truncate_judge_input_chars: 8192
meta_eval:
  top_models: 20
  split: validation
  battles_per_model: 1
  validation_fraction: 0.5
  panel_file: /work/dlclarge1/lushtake-hiwi/judge-tuning-intermediate-20261014/panels/panels.json
run:
  seed: 0
  result_folder: /work/dlclarge1/lushtake-hiwi/judge-tuning-intermediate-20261014/results
  store_root: /work/dlclarge1/lushtake-hiwi/judge-tuning-local-20261012/cache
  use_tqdm: false
tune_judge:
  meta_eval_task: meta-eval-lmarena-140k-en
  objectives:
  - agreement
  - cost
  objective_bounds:
    agreement:
    - 0.4
    - 0.4673469387755102
    cost:
    - 0.33752316326530646
    - 14.60736244897959
  fidelity:
    battles_per_model:
      lower: 20
      upper: 180
  search_space:
    judge:
      model:
      - VLLM/Qwen/Qwen3.5-9B
      - VLLM/Qwen/Qwen3.5-27B-FP8
      - VLLM/google/gemma-4-31B-it
      prompt_preset:
      - default
      - default_with_explanation
      - mid-criteria-off
      - mid-criteria-on
      - mid-evidence-off
      - mid-evidence-on
      - mid-verification-off
      - mid-verification-on
      - mid-verdict-off
      - mid-verdict-on
      swap_mode:
      - fixed
      - both
  optimizer:
    name: primo
    sampler: uniform
    eta: 3
    mo_selector: epsnet
    initial_design_size: 2
    device: cpu
    prior_centers:
      agreement:
        judge.model: VLLM/google/gemma-4-31B-it
        judge.prompt_preset: default
        judge.swap_mode: fixed
      cost:
        judge.model: VLLM/Qwen/Qwen3.5-9B
        judge.prompt_preset: default
        judge.swap_mode: fixed
    prior_confidences:
      agreement:
        judge.model: 0.5
        judge.prompt_preset: 0.5
        judge.swap_mode: 0.5
      cost:
        judge.model: 0.5
        judge.prompt_preset: 0.5
        judge.swap_mode: 0.5
  neps:
    total_fidelities_to_spend: 1440
    ignore_errors: true
  price_per_million_tokens:
    VLLM/Qwen/Qwen3.5-9B:
      input: 0.1
      output: 0.15
    VLLM/Qwen/Qwen3.5-27B-FP8:
      input: 0.26
      output: 2.6
    VLLM/google/gemma-4-31B-it:
      input: 0.09
      output: 0.34
  skip_test: true
  seed: 0
  run_dir: /work/dlclarge1/lushtake-hiwi/judge-tuning-intermediate-20261014/searches/primo-prior
