name: "Publish"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version in pyproject.toml (for example, 0.2.0)"
        required: true
        type: string
  push:
    tags:
      # Publish on any tag starting with a `v`, e.g., v0.1.0
      - v*

concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Check release version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v$version"
          git check-ref-format "refs/tags/$tag"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main || { echo "Select main to release."; exit 1; }
            test "$REQUESTED_VERSION" = "$version" || { echo "Version must match pyproject.toml ($version)."; exit 1; }
          else
            test "$GITHUB_REF" = "refs/tags/$tag" || { echo "Tag must match pyproject.toml ($tag)."; exit 1; }
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)" || { echo "Tag already points to another commit."; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build
        run: uv build
      # Check that basic features work and we didn't miss to include crucial files
      - name: Smoke test (wheel)
        working-directory: ${{ runner.temp }}
        run: uv run --isolated --no-project --python 3.12 --with "${{ github.workspace }}"/dist/*.whl "${{ github.workspace }}/tests/test_smoke.py"
      - name: Smoke test (source distribution)
        working-directory: ${{ runner.temp }}
        run: uv run --isolated --no-project --python 3.12 --with "${{ github.workspace }}"/dist/*.tar.gz "${{ github.workspace }}/tests/test_smoke.py"
      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Publish
        run: uv publish
